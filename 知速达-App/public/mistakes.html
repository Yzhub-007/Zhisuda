<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知速达 · 我的错题本</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip-link" href="#main">跳到错题内容</a><header class="site-header"><a class="brand" href="/?view=import"><span class="brand-symbol" aria-hidden="true">知</span><span>知速达<small>把复习，放回原文。</small></span></a><a href="/?view=library" class="button secondary">返回我的复习包</a><a href="/history.html" class="button secondary">练习历史</a></header>
<main id="main" class="student-main"><p class="eyebrow">从一次出错，到下一次记住</p><h1>我的错题本</h1><p class="muted">客观错题自动收录；简答题自评“部分掌握 / 未掌握”后进入待巩固。同一道题保留一张卡片，重做掌握后保留历史。</p><div id="error" class="err" role="alert" hidden></div>
<div class="panel"><label class="field"><span>查看范围</span><select id="filter"><option value="pending">待巩固</option><option value="mastered">已掌握</option><option value="all">全部历史</option></select></label><div class="row"><label class="field"><span>课程</span><select id="course"><option value="">全部课程</option></select></label><label class="field"><span>知识点</span><select id="knowledge"><option value="">全部知识点</option></select></label><label class="field"><span>最近练习时间</span><select id="period"><option value="">全部时间</option><option value="7">近 7 天</option><option value="30">近 30 天</option></select></label></div><button id="resetFilters" class="text-button">重置筛选</button><p id="count" class="small good-text" role="status"></p><button id="refresh" class="button secondary">刷新错题本</button></div><div id="retryAll" class="actions panel"></div><p id="empty" class="notice" hidden>这里暂时没有题目。完成练习后，错题与未掌握的简答题会自动出现。</p><div id="mistakeList"></div></main><footer>知速达 · 先独立回忆，再核对原文。</footer><script type="module" src="mistakes.js"></script></body></html>
