<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知速达 · 学生练习</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --pri:#1d4ed8; --ok:#166534; --okbg:#dcfce7; --bad:#991b1b; --badbg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header, main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { margin:8px 0 0; font-size:1.4rem; }
  .sub { color:var(--muted); margin:4px 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  .row button, .primary { padding:8px 16px; border:1px solid var(--line); background:var(--card); border-radius:999px; cursor:pointer; font-size:.95rem; }
  .row button[aria-pressed="true"] { background:var(--pri); color:#fff; border-color:var(--pri); }
  .primary { background:var(--pri); color:#fff; border-color:var(--pri); border-radius:8px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .q { font-weight:600; margin:0 0 8px; }
  label.opt { display:block; padding:4px 0; cursor:pointer; }
  textarea, input[type=text] { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .res { margin-top:10px; padding:8px 12px; border-radius:8px; }
  .res.ok { background:var(--okbg); color:var(--ok); }
  .res.no { background:var(--badbg); color:var(--bad); }
  .evi { background:#f3f4f6; border-left:3px solid var(--pri); padding:6px 10px; margin:8px 0; font-size:.9rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  textarea.out { height:150px; font-family:monospace; }
</style>
</head>
<body>
<header>
  <h1>知速达 · 学生练习</h1>
  <p class="sub">课程：高级数据结构与算法分析 · Lecture 1 AVL 树</p>
  <p class="muted">本页只包含教师审核通过的题目。演示版本，答案与依据在提交后显示。</p>
</header>
<main>
  <label for="nick">昵称（不用真名）</label>
  <input type="text" id="nick" maxlength="20" autocomplete="off">
  <div class="row" role="group" aria-label="选择档位" id="levels"></div>
  <section id="list"></section>
  <button class="primary" id="submit">提交并查看答案</button>
  <section id="after" hidden>
    <div class="card">
      <p class="q">这一档的难度对你合适吗？</p>
      <div class="row" role="group" aria-label="难度合适度" id="fit"></div>
      <p class="muted">1 = 太简单或太难，5 = 刚好</p>
      <label for="stuck">卡在哪里？（选填，写在哪道题、哪个概念不懂）</label>
      <textarea id="stuck" rows="3"></textarea>
      <button class="primary" id="gen" style="margin-top:10px">生成反馈数据</button>
    </div>
    <label for="out">把下面这段发给老师</label>
    <textarea id="out" class="out" readonly></textarea>
  </section>
</main>
<script>
// 只保留已通过审核的题。key 为选择题正确选项下标，简答题无 key。
const Q = [
  {n:1, lv:"基础", q:"讲义中空树的高度被定义为多少？", opts:["0","-1","1","未定义"], key:1, why:"空树为 -1，单个节点为 0。", ref:"§1.1 Definition 1.1, p.1-1"},
  {n:2, lv:"基础", q:"AVL 树中任意节点的平衡因子 BF(x) 可能取哪些值？", opts:["0, 1","-1, 0, 1","-2 到 2","任意整数"], key:1, why:"AVL 要求左右子树高度差的绝对值不超过 1。", ref:"§1.2 Definition 2.2, p.1-2"},
  {n:3, lv:"基础", q:"n 个节点的二叉搜索树连成一条单链时，树的高度是多少？", opts:["log n","n/2","n-1","n"], key:2, why:"n 个节点有 n-1 条边，高度按边数计。", ref:"§1.1, p.1-1"},
  {n:4, lv:"基础", q:"关于单旋转，下列说法正确的是？", opts:["旋转后可能破坏搜索树性质","旋转保持搜索树性质，且只需常数次操作","旋转需要遍历整棵子树","旋转只能用于根节点"], key:1, why:"旋转只重新连接少数几个指针。", ref:"§1.2.1 Proposition 1.1, p.1-4"},
  {n:5, lv:"标准", q:"设 n_h 为高度 h 的 AVL 树的最少节点数，n_0=1，n_1=2，n_h = n_{h-1} + n_{h-2} + 1。求 n_3。", opts:["5","6","7","8"], key:2, why:"n_2 = 4，n_3 = 4 + 2 + 1 = 7。", ref:"§1.2.3 Proof 2.1, p.1-6"},
  {n:6, lv:"标准", q:"插入新节点后，从最近的失衡节点朝新节点方向向下走两步，先左后右。应采用哪种调整？", opts:["一次单旋转","一次双旋转","不需要调整","重建整棵树"], key:1, why:"两步反向为 zig-zag，用双旋转。", ref:"§1.2.2, p.1-5"},
  {n:7, lv:"标准", q:"向 AVL 树插入新节点后，哪些节点的高度可能变化？", opts:["所有节点","只有根到新节点路径上的节点","只有新节点的兄弟","只有叶子节点"], key:1, why:"其他节点的子树没有变化。", ref:"§1.2.2 Proposition 1.2, p.1-5"},
  {n:8, lv:"拓展", q:"简述：为什么 n 个节点的 AVL 树高度是 O(log n)？", ans:"设 n_h 为高度 h 的 AVL 树最少节点数，n_h = n_{h-1} + n_{h-2} + 1，解得 n_h = F_{h+3} - 1，随 h 指数增长，反推 h = O(ln n)。", ref:"§1.2.3 Proof 2.1, p.1-6"},
  {n:9, lv:"拓展", q:"简述：zig-zig 情形下，为什么单旋转能让受影响子树的高度恢复到插入前？", ans:"设 Z 高 h，则 X、Y 也为 h，插入前 k2 子树高 h+2。插入后 k2 高 h+3 失衡。右旋后 k1 为根的子树高 h+2，与插入前相同。", ref:"§1.2.2 Case 1, p.1-6"}
];
const LV = ["基础","标准","拓展"];
let cur = null, fit = null, results = {};

const $ = id => document.getElementById(id);
const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; };

function drawLevels() {
  $("levels").replaceChildren(...LV.map(l => {
    const b = mk("button", l); b.setAttribute("aria-pressed", l === cur);
    b.onclick = () => { cur = l; results = {}; $("after").hidden = true; drawLevels(); drawList(); };
    return b;
  }));
}
function drawList() {
  const list = $("list"); list.replaceChildren();
  if (!cur) { list.append(mk("p", "请先选择一个档位。不确定就从“基础”开始。", "muted")); return; }
  Q.filter(x => x.lv === cur).forEach(it => {
    const c = mk("article", "", "card"); c.id = "q" + it.n;
    c.append(mk("p", `${it.n}. ${it.q}`, "q"));
    if (it.opts) it.opts.forEach((o, i) => {
      const l = mk("label", "", "opt"), r = document.createElement("input");
      r.type = "radio"; r.name = "q" + it.n; r.value = i;
      l.append(r, " " + "ABCD"[i] + ". " + o); c.append(l);
    });
    else { const t = document.createElement("textarea"); t.rows = 3; t.setAttribute("aria-label", "第" + it.n + "题作答"); c.append(t); }
    list.append(c);
  });
}
function grade() {
  Q.filter(x => x.lv === cur).forEach(it => {
    const c = $("q" + it.n); c.querySelector(".res")?.remove();
    const box = mk("div", "", "res");
    if (it.opts) {
      const sel = c.querySelector("input:checked");
      const ok = sel && Number(sel.value) === it.key;
      results[it.n] = ok;
      box.classList.add(ok ? "ok" : "no");
      box.textContent = (sel ? (ok ? "答对了。" : "答错了。") : "还没作答。") + ` 正确答案：${"ABCD"[it.key]}。${it.why}`;
    } else {
      box.append(mk("p", "参考答案：" + it.ans));
      const l = mk("label", "对照后，你觉得自己");
      const s = document.createElement("select");
      s.setAttribute("aria-label", "第" + it.n + "题自评");
      ["答对了","部分答对","没答出来"].forEach((t, i) => s.append(new Option(t, i)));
      s.onchange = () => { results[it.n] = s.value === "0"; };
      results[it.n] = true; l.append(" ", s); box.append(l);
    }
    box.append(mk("div", "原文依据：" + it.ref, "evi"));
    c.append(box);
  });
}
function buildFit() {
  $("fit").replaceChildren(...[1,2,3,4,5].map(n => {
    const b = mk("button", String(n)); b.setAttribute("aria-pressed", fit === n);
    b.onclick = () => { fit = n; buildFit(); };
    return b;
  }));
}
$("submit").onclick = () => { if (!cur) { drawList(); return; } grade(); $("after").hidden = false; buildFit(); };
$("gen").onclick = () => {
  const nick = $("nick").value.trim() || "匿名";
  const wrong = Q.filter(x => x.lv === cur && results[x.n] === false).map(x => x.n);
  const stuck = $("stuck").value.trim().replace(/\s+/g, " ") || "无";
  $("out").value = `学生 | 档位 | 做错的题号 | 卡点描述\n${nick} | ${cur} | ${wrong.length ? wrong.join("、") : "无"} | ${stuck}\n难度合适度(1-5)：${fit ?? "未填"}`;
  $("out").select();
};
drawLevels(); drawList();
</script>
</body>
</html>
